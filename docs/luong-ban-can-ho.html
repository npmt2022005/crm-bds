<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luồng bán căn hộ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dot-grid canvas with the flow only, scaled to the page width (drag to pan when narrow). Tokens follow the CRM's meraki.css. */
:root {
  --bg: #f4f7f7; --surface: #ffffff; --grid: #d3dddd; --bd: #dce5e5;
  --fg: #172c33; --fg3: #536b72; --acc: #156757; --accs: #e3f2ee; --accb: #afd4c9;
  --av: #167450; --av-bg: #e6f4ed; --tx: #905817; --tx-bg: #fcf1db;
  --sold: #a33f60; --sold-bg: #f7e9ed; --lock: #596e79; --lock-bg: #eef2f4;
  --bad: #c2333a; --bad-bg: #fbe9e9;
  --shadow: 0 1px 2px #142b3212, 0 6px 18px #142b320d;
  --f-ui: Inter, system-ui, "Segoe UI", sans-serif; --f-mono: "DM Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1a1f; --surface: #14252b; --grid: #22383f; --bd: #27424a;
  --fg: #e3eeee; --fg3: #8ea6ab; --acc: #4fc3a6; --accs: #123a33; --accb: #2a6a5b;
  --av: #5fd39c; --av-bg: #113629; --tx: #f0b35c; --tx-bg: #3a2a12;
  --sold: #f08aab; --sold-bg: #3d1b27; --lock: #a3b6bf; --lock-bg: #1f3038;
  --bad: #ff7b80; --bad-bg: #3e1a1c; --shadow: 0 1px 2px #0006, 0 8px 22px #0005; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1a1f; --surface: #14252b; --grid: #22383f; --bd: #27424a;
  --fg: #e3eeee; --fg3: #8ea6ab; --acc: #4fc3a6; --accs: #123a33; --accb: #2a6a5b;
  --av: #5fd39c; --av-bg: #113629; --tx: #f0b35c; --tx-bg: #3a2a12;
  --sold: #f08aab; --sold-bg: #3d1b27; --lock: #a3b6bf; --lock-bg: #1f3038;
  --bad: #ff7b80; --bad-bg: #3e1a1c; --shadow: 0 1px 2px #0006, 0 8px 22px #0005; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 14px; }
.viewport { height: 100%; overflow: auto; cursor: grab; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background-image: radial-gradient(var(--grid) 1.1px, transparent 1.2px); background-size: 20px 20px; }
.viewport.drag { cursor: grabbing; user-select: none; }
.sizer { position: relative; margin: 0 auto; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
svg.edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.e { fill: none; stroke: var(--accb); stroke-width: 2; }
.e.danger, .e.back { stroke: var(--bad); stroke-dasharray: 6 5; opacity: .8; }
.e.alt { stroke-dasharray: 2 5; }
.dot { fill: var(--acc); } .dot.d-danger { fill: var(--bad); }
.elabel { position: absolute; transform: translate(-50%, -50%); padding: 2px 7px; border-radius: 999px; background: var(--surface); border: 1px solid var(--bd); font: 500 10.5px/1.5 var(--f-mono); color: var(--fg3); white-space: nowrap; pointer-events: none; }
.elabel.l-danger { color: var(--bad); border-color: var(--bad); }

.node { position: absolute; width: 196px; padding: 10px 12px 11px; border: 1px solid var(--bd); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); --c: var(--acc); --cb: var(--accs); }
.node::before, .node::after { content: ""; position: absolute; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--surface); border: 2px solid var(--c); }
.node::before { left: -6px; } .node::after { right: -6px; }
.node.no-in::before, .node.no-out::after { display: none; }
.n-head { display: flex; align-items: center; gap: 8px; }
.n-ic { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--cb); color: var(--c); }
.n-ic svg { width: 16px; height: 16px; }
.n-mod { font: 500 10px/1.2 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--fg3); }
.n-title { font-weight: 700; font-size: 13.5px; line-height: 1.25; }
.n-sub { margin-top: 7px; font-size: 11.5px; color: var(--fg3); line-height: 1.4; }
.chip { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; padding: 1px 7px; border-radius: 999px; font: 600 10.5px/1.6 var(--f-ui); background: var(--cb); color: var(--c); white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.k-av { --c: var(--av); --cb: var(--av-bg); } .k-tx { --c: var(--tx); --cb: var(--tx-bg); }
.k-sold { --c: var(--sold); --cb: var(--sold-bg); } .k-lock { --c: var(--lock); --cb: var(--lock-bg); }
.k-bad { --c: var(--bad); --cb: var(--bad-bg); }
@media (prefers-reduced-motion: reduce) { .dot { display: none; } }
</style>
</head>
<body>

<div class="viewport" id="vp" aria-label="Sơ đồ luồng bán căn hộ">
  <div class="sizer" id="sizer">
    <div class="stage" id="stage">
      <svg class="edges" id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
</div>

<script>
(() => {
  const W = 2170, H = 720, NW = 196;
  const IC = {
    build: '<path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5M9 10h.01M15 10h.01"/>',
    grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
    list: '<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
    lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    doc: '<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
    cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',
    check: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
    coin: '<circle cx="12" cy="12" r="9"/><path d="M15 9c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.8 3 2.2 3 1 3 2.3-1.3 2-3 2c-1.4 0-2.6-.6-3-1.6M12 6v1.5M12 16.5V18"/>',
    key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>',
    swap: '<path d="M4 8h14l-3-3M20 16H6l3 3"/>',
    x: '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>'
  };
  const N = [
    { id: "proj", x: 40, y: 90, k: "lock", ic: "build", mod: "Dự án", t: "Mở bán căn", sub: "Chưa mở bán → Chưa bán", chip: "Chưa mở bán", in: 0 },
    { id: "cust", x: 40, y: 420, k: "acc", ic: "user", mod: "Khách hàng", t: "Hồ sơ khách", sub: "Tạo mới hoặc nhập từ Excel", in: 0 },
    { id: "grid", x: 310, y: 90, k: "av", ic: "grid", mod: "Dự án", t: "Bảng căn", sub: "Lưới theo toà, tầng, 4 màu trạng thái", chip: "Chưa bán" },
    { id: "sale", x: 310, y: 420, k: "acc", ic: "list", mod: "Hồ sơ căn · Giao dịch", t: "Lập giao dịch", sub: "Khách hàng → Lịch thanh toán → Thông tin GD → Ký quỹ" },
    { id: "hold", x: 580, y: 255, k: "tx", ic: "lock", mod: "Trạng thái căn", t: "Giữ chỗ / Đặt cọc", sub: "Lý do: Giữ chỗ hoặc Đặt cọc", chip: "Đang xử lý GD" },
    { id: "escrow", x: 850, y: 90, k: "acc", ic: "doc", mod: "Hợp đồng · Bước 1", t: "Thỏa thuận ký quỹ", sub: "Điền từ mẫu, xem và tải PDF" },
    { id: "schedule", x: 850, y: 420, k: "acc", ic: "cal", mod: "Lịch thanh toán", t: "Phương thức & đợt thu", sub: "Theo tiến độ · Thanh toán nhanh · Vay ngân hàng" },
    { id: "cancel", x: 850, y: 590, k: "bad", ic: "x", mod: "Trạng thái căn", t: "Huỷ giao dịch", sub: "Đang xử lý GD → Chưa bán", chip: "Cần xác nhận", out: 0 },
    { id: "deposit", x: 1120, y: 90, k: "acc", ic: "pen", mod: "Hợp đồng · Bước 2", t: "Thỏa thuận đặt cọc", sub: "Ký xong thì lập HĐMB nháp" },
    { id: "hdmb", x: 1390, y: 255, k: "acc", ic: "doc", mod: "Hợp đồng · Bước 3", t: "Hợp đồng mua bán", sub: "Nháp → Chờ duyệt → Đã duyệt → Đã ký" },
    { id: "sold", x: 1660, y: 255, k: "sold", ic: "check", mod: "Trạng thái căn", t: "Căn đã bán", sub: "Lý do: Ký HĐMB", chip: "Đã bán" },
    { id: "pay", x: 1930, y: 90, k: "acc", ic: "coin", mod: "Lịch thanh toán", t: "Thu tiền theo đợt", sub: "Phiếu thu, xem trước chứng từ", out: 0 },
    { id: "handover", x: 1930, y: 300, k: "acc", ic: "key", mod: "Hồ sơ căn", t: "Điều kiện bàn giao", sub: "Kiểm tra trước khi giao nhà" },
    { id: "transfer", x: 1930, y: 510, k: "acc", ic: "swap", mod: "Hồ sơ căn", t: "Chuyển nhượng", sub: "Lý do: Chuyển nhượng", out: 0 }
  ];
  const E = [
    ["proj", "grid", "main", "Mở bán", -16], ["grid", "hold", "main", "Chọn căn"], ["cust", "sale", "main"], ["sale", "hold", "main", "Gắn khách"],
    ["hold", "escrow", "main"], ["hold", "schedule", "main"], ["escrow", "deposit", "main", "Đã ký"], ["deposit", "hdmb", "main"],
    ["escrow", "hdmb", "alt"], ["schedule", "hdmb", "main", "Áp lịch"], ["hdmb", "sold", "main", "Ký HĐMB"],
    ["sold", "pay", "main"], ["sold", "handover", "main"], ["handover", "transfer", "main"],
    ["hold", "cancel", "danger", "Huỷ"], ["cancel", "grid", "back", "Trả về Chưa bán"]
  ];

  const byId = Object.fromEntries(N.map((n) => [n.id, n]));
  const stage = document.getElementById("stage"), svg = document.getElementById("svg");
  const vp = document.getElementById("vp"), sizer = document.getElementById("sizer");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  stage.style.width = W + "px"; stage.style.height = H + "px";
  svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  N.forEach((n) => {
    const el = document.createElement("div");
    el.className = "node" + (n.k === "acc" ? "" : " k-" + n.k) + (n.in === 0 ? " no-in" : "") + (n.out === 0 ? " no-out" : "");
    el.style.left = n.x + "px"; el.style.top = n.y + "px"; el.style.width = NW + "px";
    el.innerHTML = '<div class="n-head"><span class="n-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + IC[n.ic] + '</svg></span><div><div class="n-mod">' + esc(n.mod) + '</div><div class="n-title">' + esc(n.t) + '</div></div></div>' +
      '<div class="n-sub">' + esc(n.sub) + '</div>' + (n.chip ? '<span class="chip">' + esc(n.chip) + '</span>' : '');
    stage.appendChild(el); n.el = el;
  });

  const geom = (n) => ({ x: n.x, y: n.y, w: NW, h: n.el.offsetHeight });
  function pathFor(a, b, kind) {
    const A = geom(a), B = geom(b);
    if (kind === "back") {
      const sx = A.x, sy = A.y + A.h / 2, tx = B.x, ty = B.y + B.h / 2, lane = B.x - 12, r = 12;
      return "M" + sx + "," + sy + " H" + (lane + r) + " Q" + lane + "," + sy + " " + lane + "," + (sy - r) + " V" + (ty + r) + " Q" + lane + "," + ty + " " + (lane + r) + "," + ty + " H" + tx;
    }
    if (Math.abs(A.x - B.x) < 40) {
      const sx = A.x + A.w / 2, sy = A.y + A.h, tx = B.x + B.w / 2, ty = B.y, dy = (ty - sy) / 2;
      return "M" + sx + "," + sy + " C" + sx + "," + (sy + dy) + " " + tx + "," + (ty - dy) + " " + tx + "," + ty;
    }
    if (kind === "danger") {
      const sx = A.x + A.w / 2, sy = A.y + A.h, tx = B.x, ty = B.y + B.h / 2;
      return "M" + sx + "," + sy + " C" + sx + "," + ty + " " + (tx - 60) + "," + ty + " " + tx + "," + ty;
    }
    const sx = A.x + A.w, sy = A.y + A.h / 2, tx = B.x, ty = B.y + B.h / 2, c = Math.max(40, (tx - sx) * 0.5);
    return "M" + sx + "," + sy + " C" + (sx + c) + "," + sy + " " + (tx - c) + "," + ty + " " + tx + "," + ty;
  }

  const NS = "http://www.w3.org/2000/svg";
  function draw() {
    svg.innerHTML = ""; stage.querySelectorAll(".elabel").forEach((l) => l.remove());
    E.forEach(([a, b, kind, label, dy], i) => {
      const p = document.createElementNS(NS, "path");
      p.id = "e" + i; p.setAttribute("d", pathFor(byId[a], byId[b], kind)); p.setAttribute("class", "e " + kind);
      svg.appendChild(p);
      const len = p.getTotalLength(), bad = kind === "danger" || kind === "back";
      if (!reduce && kind !== "alt") {
        const dot = document.createElementNS(NS, "circle");
        dot.setAttribute("r", 3.6); dot.setAttribute("class", "dot" + (bad ? " d-danger" : ""));
        const m = document.createElementNS(NS, "animateMotion");
        m.setAttribute("dur", Math.max(1.6, len / 110).toFixed(2) + "s");
        m.setAttribute("repeatCount", "indefinite");
        m.setAttribute("begin", "-" + ((i * 0.37) % 2).toFixed(2) + "s");
        const mp = document.createElementNS(NS, "mpath"); mp.setAttribute("href", "#e" + i);
        m.appendChild(mp); dot.appendChild(m); svg.appendChild(dot);
      }
      if (label) {
        const pt = p.getPointAtLength(kind === "back" ? len * 0.35 : len / 2);
        const l = document.createElement("span");
        l.className = "elabel" + (bad ? " l-danger" : "");
        l.textContent = label; l.style.left = pt.x + "px"; l.style.top = pt.y + (dy || 0) + "px";
        stage.appendChild(l);
      }
    });
  }

  function fit() {
    const cs = getComputedStyle(vp);
    const avail = vp.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const z = Math.max(0.5, Math.min(1, avail / W));
    stage.style.transform = "scale(" + z + ")";
    sizer.style.width = W * z + "px"; sizer.style.height = H * z + "px";
  }

  let drag = null;
  vp.addEventListener("pointerdown", (e) => { if (e.button !== 0) return; drag = { x: e.clientX, y: e.clientY, l: vp.scrollLeft, t: vp.scrollTop }; vp.setPointerCapture(e.pointerId); vp.classList.add("drag"); });
  vp.addEventListener("pointermove", (e) => { if (!drag) return; vp.scrollLeft = drag.l - (e.clientX - drag.x); vp.scrollTop = drag.t - (e.clientY - drag.y); });
  const end = () => { drag = null; vp.classList.remove("drag"); };
  vp.addEventListener("pointerup", end); vp.addEventListener("pointercancel", end);
  addEventListener("resize", fit);

  draw(); fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
})();
</script>
</body>
</html>
